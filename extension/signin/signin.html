<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QTS Sign In</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    form { display: flex; flex-direction: column; gap: 12px; padding: 4px 4px 6px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { color: #475569; font: 700 11px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    input { width: 100%; height: 44px; padding: 0 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fff; color: #0f172a; box-shadow: 0 1px 2px #0f172a0d; font: 600 14px/1 Inter, ui-sans-serif, system-ui, sans-serif; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
    input:hover { border-color: #c7d2fe; }
    input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px #8b5cf62e; }
    input:disabled { opacity: .7; }
    button { height: 44px; margin-top: 2px; border: 0; border-radius: 12px; background: linear-gradient(110deg, #6366f1, #8b5cf6 45%, #d946ef 90%); background-size: 180% 100%; color: #fff; box-shadow: 0 12px 24px -10px #7c3aedcc; font: 800 14px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; cursor: pointer; transition: background-position .4s ease, transform .15s ease, box-shadow .2s ease; }
    button:hover { background-position: 100% 0; box-shadow: 0 14px 28px -10px #c026d3cc; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
    button:disabled { opacity: .75; cursor: progress; transform: none; }
    .error { margin: 0; padding: 9px 11px; border: 1px solid #fecaca; border-radius: 10px; background: #fef2f2; color: #b91c1c; font: 600 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
    .error[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { input, button { transition: none; } }
  </style>
</head>
<body>
  <form aria-label="Manager sign in" novalidate>
    <div class="field">
      <label for="login-user">User Name</label>
      <input id="login-user" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <p class="error" role="alert" hidden></p>
    <button type="submit">Sign In</button>
  </form>
  <script src="signin.js"></script>
</body>
</html>
